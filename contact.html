    <main class="contact-page container py-0">
      <section class="contact-hero text-center">
        <span class="eyebrow">Let’s Work Together</span>
        <h1 class="display-5 fw-bold mb-3">Request a Quote</h1>
        <p class="lead mx-auto mb-0">
          Tell us about your goals, and we’ll connect with you to discuss how
          Onyx Strategic Solutions can help.
        </p>
      </section>

      <section class="quote-form-panel mx-auto my-5">
        <form action="#" method="post">
          <div class="row g-4">
            <div class="col-md-6">
              <label class="form-label" for="name">Name</label>
              <input class="form-control" id="name" name="name" type="text" required />
            </div>
            <div class="col-md-6">
              <label class="form-label" for="email">Email</label>
              <input class="form-control" id="email" name="email" type="email" required />
            </div>
            <div class="col-md-6">
              <label class="form-label" for="organization">Organization</label>
              <input class="form-control" id="organization" name="organization" type="text" />
            </div>
            <div class="col-md-6">
              <label class="form-label" for="service">Service of Interest</label>
              <select class="form-select" id="service" name="service" required>
                <option value="" selected disabled>Select a service</option>
                <option>Project Management</option>
                <option>Procurement</option>
                <option>Process Management</option>
                <option>People &amp; Process Enablement</option>
                <option>Root Cause Analysis</option>
                <option>Other</option>
              </select>
            </div>
            <div class="col-12">
              <label class="form-label" for="timeline">Desired Timeline</label>
              <input class="form-control" id="timeline" name="timeline" type="text" placeholder="For example: Immediate, within 30 days, or exploratory" />
            </div>
            <div class="col-12">
              <label class="form-label" for="details">How can we help?</label>
              <textarea class="form-control" id="details" name="details" rows="6" required></textarea>
            </div>
            <div class="col-12 text-center">
              <button class="btn quote-submit px-4" type="submit">Request a Quote</button>
            </div>
          </div>
        </form>
      </section>
    </main>

    <style>
      body {
        font-family: Inter, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }

      .navbar-custom {
        --bs-navbar-color: rgb(180, 140, 140);
        --bs-navbar-hover-color: white;
        --bs-navbar-active-color: rgb(180, 140, 140);
        /* --bs-navbar-active-color: rgb(192, 123, 157); */
      }
      .footer-custom {
        color: rgb(180, 140, 140);
        padding: 0.5rem 0;
        text-align: center;
        background-color: #1f1f1f !important;
      }

      .footer-brand img {
        width: 150px !important;
        max-width: none;
        height: auto;
        filter: brightness(0) invert(1);
      }

      .footer-nav {
        font-size: 0.9rem;
      }

      .footer-link {
        color: rgb(180, 140, 140);
        text-decoration: none;
        transition: color 0.2s ease;
      }

      .footer-link:hover {
        color: white;
      }

      .navbar .container {
        align-items: center;
        display: flex;
        flex-wrap: wrap;
      }

      .navbar-brand {
        flex: 0 0 auto;
      }

      .navbar-brand img {
        height: auto;
        max-width: 300px;
        width: min(300px, 45vw);
      }

      .navbar-collapse {
        display: flex !important;
        flex: 1 1 auto;
        justify-content: flex-end;
      }

      .navbar-nav {
        flex-wrap: wrap;
        justify-content: flex-end;
        margin-top: 0 !important;
      }

      @media (max-width: 576px) {
        .navbar-collapse {
          flex-basis: 100%;
          margin-top: 0.5rem;
        }
      }

      html,
      body {
        background-color: rgb(180, 140, 140) !important;
        background-image: none;
      }

      main {
        background-color: transparent !important;
      }

      .navbar {
        background-color: #1f1f1f !important;
      }

      .contact-page {
        max-width: 1100px;
      }

      .contact-hero {
        background: radial-gradient(
          ellipse at center,
          #000 0%,
          #1f1f1f 58%,
          rgba(136, 95, 95, 0.9) 100%
        );
        border: 0;
        border-top: 1px solid rgb(180, 140, 140);
        border-bottom: 1px solid #000;
        color: white;
        height: 260px;
        padding: 3.5rem 2rem;
        width: 100vw;
        margin-left: calc(50% - 50vw);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
      }

      .contact-hero > * {
        max-width: 820px;
        margin-left: auto;
        margin-right: auto;
      }

      .contact-hero .eyebrow,
      .contact-hero h1,
      .contact-hero p {
        text-align: center;
        width: 100%;
      }

      .eyebrow {
        color: rgb(220, 180, 180);
        display: inline-block;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        margin-bottom: 0.75rem;
        text-transform: uppercase;
      }

      .quote-form-panel {
        background: rgba(255, 255, 255, 0.94);
        border-left: 5px solid rgb(180, 140, 140);
        border-radius: 1rem;
        box-shadow: 0 0.75rem 1.5rem rgba(31, 31, 31, 0.12);
        max-width: 850px;
        padding: 2rem;
      }

      .form-label {
        color: #2b2b2b;
        font-weight: 600;
      }

      .form-control,
      .form-select {
        border-color: rgba(180, 140, 140, 0.55);
        min-height: 44px;
      }

      .form-control:focus,
      .form-select:focus {
        border-color: rgb(180, 140, 140);
        box-shadow: 0 0 0 0.25rem rgba(180, 140, 140, 0.2);
      }

      .quote-submit {
        background-color: rgb(136, 95, 95);
        border-color: rgb(136, 95, 95);
        color: white;
      }

      .quote-submit:hover {
        background-color: #1f1f1f;
        border-color: #1f1f1f;
        color: white;
      }

      .video-container {
        position: relative;
        width: 100%;
        height: 100vh; /* Full viewport height */
        overflow: hidden;
      }
      .bg-video {
        position: absolute;
        top: 50%;
        left: 50%;
        min-width: 100%;
        min-height: 100%;
        width: auto;
        height: auto;
        transform: translate(-50%, -50%);
        object-fit: cover; /* Forces video to behave like background-size: cover */
        z-index: 1;
        opacity: 1; /* Adjust opacity as needed */
      }

      /* Semi-transparent dark overlay to protect text contrast */
      .video-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.4); /* Adjust opacity as needed */
        z-index: 2;
      }

      /* Forces the Bootstrap container to sit cleanly on top of the video */
      .video-container .container {
        z-index: 3;
      }
      .bg-custom {
        background-color: rgba(
          180,
          140,
          140,
          0.95
        ); /* Adjust opacity as needed */
        .carousel-item {
          min-height: 280px;
        }
      }
    </style>
